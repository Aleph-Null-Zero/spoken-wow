name: Launcher

# Builds, tests and releases Spoken Launcher (launcher/) for Windows, macOS and Linux.
#
#   workflow_dispatch     test and package on all three systems; the installers are kept as
#                         workflow artifacts, nothing is released.
#   tag launcher/vX.Y.Z   the same, then a release for the tag with every installer, then the
#                         `launcher-latest` release is refreshed: the launcher's own updater reads
#                         latest*.yml from there (launcher/src/main/updater.ts, FEED_URL).
#
# The tag has to match "version" in launcher/package.json; the release job checks it.
#
# First release: `launcher-latest` does not exist yet and the release job creates it as a normal
# release (not a draft, not a pre-release) that is not marked "latest", so the repo's "latest"
# release stays Spoken's own. Later runs only swap its assets.
on:
  workflow_dispatch:
  push:
    tags:
      - "launcher/v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: launcher

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: launcher-windows
            files: |
              launcher/release/*.exe
              launcher/release/*.exe.blockmap
              launcher/release/latest.yml
          - os: macos-latest
            script: dist:mac
            artifact: launcher-macos
            files: |
              launcher/release/*.dmg
              launcher/release/*.dmg.blockmap
              launcher/release/*.zip
              launcher/release/*.zip.blockmap
              launcher/release/latest-mac.yml
          - os: ubuntu-latest
            script: dist:linux
            artifact: launcher-linux
            files: |
              launcher/release/*.AppImage
              launcher/release/*.tar.gz
              launcher/release/latest-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      # macOS is signed with the Developer ID certificate and notarized with an App Store Connect
      # API key. A run without the secrets (a fork) builds it unsigned; a release tag never does.
      # When Apple refuses to notarize (an agreement it says is unsigned, an outage), the build is
      # made again signed only, with a warning: players get "could not verify" and Open Anyway
      # instead of no release.
      - name: Build the installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            # The certificate goes into a keychain of this run's own; electron-builder finds the
            # Developer ID identity there. (Its CSC_LINK import fails on the runner's keychain.)
            keychain="$RUNNER_TEMP/signing.keychain-db"
            pass="$(openssl rand -hex 24)"
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$keychain"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          elif [ "$RUNNER_OS" = macOS ] && [[ "$GITHUB_REF" == refs/tags/launcher/v* ]]; then
            echo "A release needs the macOS signing secrets (MAC_CSC_LINK and the rest)." >&2
            exit 1
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${APPLE_API_KEY:-}" ]; then
            npm run ${{ matrix.script }}
          elif npm run ${{ matrix.script }} 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          elif grep -q "Failed to notarize" "$RUNNER_TEMP/build.log"; then
            echo "::warning title=Not notarized::Apple refused to notarize the macOS build; it ships signed only. See the log above."
            rm -rf release
            # electron-builder notarizes only when these are set.
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            npm run ${{ matrix.script }}
          else
            exit 1
          fi
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check the macOS signature and notarization
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        shell: bash
        run: |
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            if [ "${NOTARIZED:-}" = true ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
          done
        env:
          SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Release
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/launcher/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: launcher-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against package.json
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#launcher/v}"
          have="$(node -p "require('./launcher/package.json').version")"
          if [ "$version" != "$have" ]; then
            echo "Tag ${GITHUB_REF_NAME} says ${version} but launcher/package.json says ${have}." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true

      - name: Create the release for the tag
        working-directory: .
        run: |
          ls -l dist
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          # The installers only: the update feed files and block maps go to launcher-latest.
          installers="dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.tar.gz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # A re-run: the release is there already, so only its files are replaced.
            gh release upload "${GITHUB_REF_NAME}" $installers --clobber
          else
            gh release create "${GITHUB_REF_NAME}" $installers \
              --title "Spoken Launcher ${GITHUB_REF_NAME#launcher/v}" \
              --notes "Installers for Windows, macOS and Linux. See launcher/README.md for how to install them." \
              --verify-tag --latest=false $flags
          fi

      # What the launcher's updater reads: latest.yml, latest-mac.yml, latest-linux.yml and the files
      # they name. A pre-release tag does not touch it, so only stable versions reach players.
      - name: Refresh the launcher-latest release
        working-directory: .
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) echo "Pre-release tag: launcher-latest is left alone."; exit 0 ;;
          esac
          if gh release view launcher-latest >/dev/null 2>&1; then
            # Upload first, then drop what the new version no longer ships, so a failed upload
            # leaves the old feed working and a re-run picks up from there.
            gh release upload launcher-latest dist/* --clobber
            gh release view launcher-latest --json assets --jq '.assets[].name' | while read -r name; do
              [ -e "dist/$name" ] || gh release delete-asset launcher-latest "$name" --yes
            done
          else
            # First run: a normal release (not a draft, not a pre-release), and not "latest".
            gh release create launcher-latest dist/* \
              --title "Spoken Launcher (update feed)" \
              --notes "The files the launcher downloads its own updates from. Replaced by each launcher release; do not edit." \
              --latest=false
          fi
          gh release edit launcher-latest --draft=false --prerelease=false --latest=false
